version: '1.0'
domain: GL Assistant
notes: Natural-language question variants for GL (Balances first, Journals later).
  Use as training & test seed.
intents:
- name: balance.lookup.segments.period
  description: Get balance using COA segments (company/department/account) or natural account.
  entities:
  - period
  - company
  - department
  - account
  - actual_flag
  utterances:
  - What is the balance for Account 16160 in 03-23?
  - Show period balance for 16160, 03-23.
  - Give me the balance of 16160 this period (03-23).
  - Balance for 16160 in 03-23 on US Primary Ledger.
  - Ending balance for Account 16160 in 02-23.
  - Fetch actual balance for US Primary Ledger, period 03-23, Account 16160.
  - Show balance for Company 942, Dept 90, Account 16160 in 02-23.
  - Get 942-90-16160 in 03-23.
  - Balance for company 942 account 16160 this period.
  - What is the YTD for Account 16160?
  - Give me YTD balance for 16160 in 03-23.
  - YTD on 16160, US Primary Ledger.
  - Show actual YTD for 16160.
- name: balance.diff.two_periods
  description: Compare balances (difference) across two periods for an account or segments.
  entities:
  - period_from
  - period_to
  - account
  - company
  - department
  - actual_flag
  utterances:
  - Compare 01-23 vs 02-23 for Account 16160.
  - What changed between 01-23 and 02-23 on 16160?
  - Δ for 942-90-16160 between 02-23 and 03-23.
  - Show month-on-month change for Account 16160 (01-23 to 02-23).
- name: balance.trend.last_n
  description: Return last N periods balances for an account (trend).
  entities:
  - period
  - account
  - n
  - actual_flag
  utterances:
  - Show last 5 periods for Account 16160.
  - Trend for last 6 months on account 16160.
  - Give me the 4-period history for 16160.
  - How has 16160 trended recently?
- name: balance.type.override
  description: Specify Actual/Budget/Encumbrance balances.
  entities:
  - period
  - account
  - company
  - department
  - actual_flag
  utterances:
  - Budget balance for 942-90-16160 in 03-23.
  - Encumbrance amount for Account 16160 this period.
  - Actuals for 16160 in 02-23.
  - Show budget YTD for 942.90.16160.
- name: balance.currency.override
  description: Ask results in a specific currency (if supported by backend).
  entities:
  - period
  - account
  - currency_code
  - actual_flag
  utterances:
  - Show balance for 16160 in USD for 03-23.
  - Convert Account 16160 to ledger currency in 02-23.
  - Give foreign currency balance for 16160 (EUR).
- name: balance.explain.calculation
  description: Ask to explain how a balance was derived (begin + activity).
  entities:
  - period
  - account
  - company
  - department
  utterances:
  - Explain how the balance for 16160 in 03-23 was calculated.
  - Break down begin balance and period activity for 942-90-16160.
  - Show debit/credit breakdown for Account 16160 this period.
- name: balance.high_level
  description: Exploratory / conversational high-level asks.
  entities:
  - period
  utterances:
  - What does our GL look like this month?
  - Show accounts with high balances in 03-23.
  - Which accounts changed the most this period?
  - Anything unusual in the GL this month?
- name: journals.lookup.basic
  description: 'Phase 2: basic journal lookups for an account/period.'
  entities:
  - period
  - account
  - company
  - department
  - status
  utterances:
  - Show journals for Account 16160 in 02-23.
  - Get all posted journals for 03-23 for 942-90-16160.
  - What journals hit 16160 this period?
- name: journals.summary.by_source
  description: 'Phase 2: journal totals by source/category.'
  entities:
  - period
  - source
  - category
  utterances:
  - Journal totals by source (Manual vs Payables) for 03-23.
  - Show journal summary by category in 02-23.
  - How much came from Payables this month?
