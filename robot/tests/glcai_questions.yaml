version: '1.0'
domain: GL Assistant
notes: Natural-language question variants for GL (Balances first, Journals later).
  Use as training & test seed.
intents:
- name: balance.lookup.segments.period
  description: Get balance using COA segments (company/department/account) or natural account.
  entities:
    - period
    - company
    - department
    - account
    - actual_flag
    - amount_type
  utterances:
    - What is the balance for Account 16160 in 03-23?
    - Show period balance for 16160, 03-23.
    - Give me the balance of 16160 this period (03-23).
    - Balance for 16160 in 03-23 on US Primary Ledger.
    - Ending balance for Account 16160 in 02-23.
    - Fetch actual balance for US Primary Ledger, period 03-23, Account 16160.
    - Show balance for Company 942, Dept 90, Account 16160 in 02-23.
    - Get 942-90-16160 in 03-23.
    - Balance for company 942 account 16160 this period.
    - What is the YTD for Account 16160?
    - Give me YTD balance for 16160 in 03-23.
    - YTD on 16160, US Primary Ledger.
    - Show actual YTD for 16160.

    # NEW — Entered vs Accounted amounts
    - Show entered balance for 16160 in 03-23.
    - Show accounted balance for 16160 in 03-23.
    - What is the entered amount for account 16160 for this period?
    - What is the accounted amount for account 16160 for this period?
    - Get entered vs accounted amounts for 942-90-16160 in 03-23.
    - Compare entered and accounted balances for account 16160 in 02-23.
    - Show entered currency amount for 16160 in 03-23.
    - Show accounted (ledger currency) amount for 16160 in 03-23.
    - What is the accounted YTD for 16160?
    - Give me entered YTD for 16160 for 03-23.
- name: balance.diff.two_periods
  description: Compare balances (difference) across two periods for an account or segments.
  entities:
  - period_from
  - period_to
  - account
  - company
  - department
  - actual_flag
  utterances:
  - Compare 12-23 vs 12-24 for Account 16160.
  - What changed between 12-23 and 12-24 on 16160?
  - How did account 16160 change from 12-23 to 12-24?
  - Show year-on-year change for Account 16160 from 12-23 to 12-24.
  - Difference in balance for 16160 between 12-23 and 12-24 on US Primary Ledger.
  - Compare 12-23 to 12-24 for 942-90-16160.
- name: balance.trend.last_n
  description: Return last N periods balances for an account (trend).
  entities:
  - period
  - account
  - n
  - actual_flag
  utterances:
  - Show last 5 periods for Account 16160.
  - Trend for last 6 periods on account 16160.
  - Give me the 4-period history for 16160.
  - How has 16160 trended recently?
  - Show me the balance trend for account 15110 over the last 4 periods.
  - What does the trend look like for 16160 as of 12-24?
  - Last 3 periods for account 16160 ending 12-24.
- name: balance.type.override
  description: Specify Actual/Budget/Encumbrance balances.
  entities:
  - period
  - account
  - company
  - department
  - actual_flag
  utterances:
  - Budget balance for 942-90-16160 in 12-24.
  - Encumbrance amount for Account 16160 in 12-24.
  - Actuals for 16160 in 12-23.
  - Show budget YTD for 942.90.16160 in 12-24.
  - What is the actual balance for 16160 in 12-24?
  - Show me the actual flag A balance for account 16160, period 12-24.
- name: balance.currency.override
  description: Ask results in a specific currency (if supported by backend).
  entities:
  - period
  - account
  - currency_code
  - actual_flag
  utterances:
  - Show balance for 16160 in USD for 12-24.
  - Convert Account 16160 to ledger currency in 12-23.
  - Give foreign currency balance for 16160 (EUR) in 12-24.
  - What is the USD balance for account 15110 in 12-24?
- name: balance.explain.calculation
  description: Ask to explain how a balance was derived (begin + activity).
  entities:
  - period
  - account
  - company
  - department
  utterances:
  - Explain how the balance for 16160 in 12-24 was calculated.
  - Break down begin balance and period activity for 942-90-16160 in 12-24.
  - Show debit/credit breakdown for Account 16160 in 12-24.
  - What are the begin balance and period net amounts for account 16160 in 12-23?
  - Walk me through the YTD calculation for 15110 in 12-24.
- name: balance.high_level
  description: Exploratory / conversational high-level asks.
  entities:
  - period
  utterances:
  - Show accounts with high balances in 12-24.
  - Which accounts had the highest activity in 12-24?
  - Top 5 accounts by balance in 12-24 on US Primary Ledger.
  - What are the biggest balances in the GL for 12-24?
  - Show me the top accounts for period 12-23.
  - Which accounts changed the most in 12-24?
  - What does the GL look like for period 12-24?
  - Anything unusual in the balances for 12-24?
- name: balance.lookup.ccid.period
  description: Get balance directly using Code Combination ID (CCID) and period.
  entities:
  - ccid
  - period
  - actual_flag
  utterances:
  - What is the balance for CCID 300000047428567 in 12-24?
  - Get YTD balance for code combination 300000047428567, period 12-24.
  - CCID 300000047428567 balance for 12-24 on US Primary Ledger.
  - Show the balance for code combination ID 300000047428567 in period 12-23.
  - Balance lookup by CCID 300000047428567 for period 12-24.
- name: balance.why_null_or_zero
  description: Diagnose why a balance is null, zero, or missing — checks account and CCID existence and whether balance rows exist.
  entities:
  - account
  - ccid
  - period
  utterances:
  - Why is the balance for account 16160 null in 12-24?
  - Does account 16160 exist with data in 12-24?
  - Why is account 11200 showing zero balance?
  - Check if CCID 300000047428567 has balance data in 12-24.
  - Why is there no balance for account 11200 in period 01-23?
  - Does account 15110 have data in the GL for period 12-24?
  - Is account 16160 open and posting for US Primary Ledger?
- name: journals.lookup.basic
  description: 'Phase 2: basic journal lookups for an account/period.'
  entities:
  - period
  - account
  - company
  - department
  - status
  utterances:
  - Show journals for Account 16160 in 12-24.
  - Get all posted journals for 12-24 for 942-90-16160.
  - What journals hit 16160 in 12-23?
- name: journals.summary.by_source
  description: 'Phase 2: journal totals by source/category.'
  entities:
  - period
  - source
  - category
  utterances:
  - Journal totals by source (Manual vs Payables) for 12-24.
  - Show journal summary by category in 12-23.
  - How much came from Payables in 12-24?
