<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GL Connect Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>

    <!-- ── Header ── -->
    <header class="app-header">
      <a class="logo" href="/">
        <img
          src="https://splashbi.com/wp-content/uploads/2019/05/splashbi-R-for-light-backgrounds-1.png"
          alt="GL Connect"
          class="logo-img"
          onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';"
        >
        <div id="logo-fallback" class="logo-fallback" style="display:none;">
          <svg class="logo-icon" viewBox="0 0 36 36" fill="none">
            <rect width="36" height="36" rx="9" fill="#0f172a"/>
            <text x="18" y="25" font-family="monospace" font-size="13" font-weight="700" fill="white" text-anchor="middle">GL</text>
          </svg>
          <div>
            <div class="logo-name">GL Connect</div>
            <div class="logo-tag">Oracle GL Assistant</div>
          </div>
        </div>
      </a>

      <div class="header-center" id="session-context-display" hidden>
        <span class="session-pill" id="session-resp-pill"></span>
        <span class="session-pill session-pill-ledger" id="session-ledger-pill"></span>
        <span class="session-pill session-pill-hierarchy" id="session-hierarchy-pill" hidden></span>
      </div>

      <div class="header-right">
        <button class="setup-btn" id="setup-btn" title="Select responsibility and ledger">
          Select Ledger
        </button>
        <div class="header-status" id="status-strip">
          <span class="status-pill">Checking...</span>
        </div>
      </div>
    </header>


<!-- ── Chat ── -->
    <div class="chat-body">
      <div class="chat-log" id="chat-log">
        <div class="message assistant">
          <div class="message-meta">GL Connect</div>
          <div class="message-bubble">
            Hello! Ask me about GL balances, account activity, period comparisons, or journal drilldowns. I'll query Oracle live and explain the results.
          </div>
        </div>
      </div>

      <!-- Hierarchy picker (hidden until needed) -->
      <div class="autocomplete-panel" id="hierarchy-autocomplete" hidden>
        <p class="autocomplete-label" id="hierarchy-autocomplete-label">Select a hierarchy</p>
        <div class="autocomplete-list" id="hierarchy-autocomplete-list"></div>
      </div>

      <!-- Composer -->
      <div class="composer-wrap">
        <form class="composer" id="chat-form" novalidate>
          <label class="sr-only" for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="1"
            placeholder="Ask about balances, accounts, periods…"
            required
          ></textarea>
          <button type="submit" class="send-btn" id="send-btn" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
      </div>
    </div>

    <template id="message-template">
      <div class="message">
        <div class="message-meta"></div>
        <div class="message-bubble"></div>
      </div>
    </template>

    <script>window.LEDGER_DATA = {{ ledger_data_json | safe }};</script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
